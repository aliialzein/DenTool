name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/api/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches: [main, develop]
    paths:
      - "apps/api/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dentool
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/dentool
        run: npx prisma validate

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dentool
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/dentool
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
  